name: windows-desktop-vnc

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Session lifetime in minutes (0 = until the 5h50m job cap)'
        required: false
        default: '45'
      vnc_port:
        description: 'VNC RFB port (loopback only, consumed by websockify)'
        required: false
        default: '5900'
      web_port:
        description: 'websockify + noVNC HTTP/WebSocket port (tunnel origin)'
        required: false
        default: '6080'

concurrency:
  group: desktop-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: 'C:\'

env:
  NOVNC_DIR: 'C:\novnc'
  CF_STAGED: 'C:\cloudflared-amd64.exe'
  CF_EXE: 'C:\ProgramData\cloudflared\cloudflared.exe'
  CF_LOG_WEB: 'C:\cf_web.log'
  CF_ERR_WEB: 'C:\cf_web.err.log'
  CF_LOG_VNC: 'C:\cf_vnc.log'
  CF_ERR_VNC: 'C:\cf_vnc.err.log'
  WS_LOG: 'C:\websockify.log'
  WS_ERR: 'C:\websockify.err.log'
  GUARD_LOG: 'C:\vncguard.log'
  URL_FILE: 'C:\desktop_urls.txt'
  TIGHTVNC_ROOT: 'C:\Program Files\TightVNC'
  PY_DEFAULT: 'C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe'
  KEEP_ALIVE: ${{ github.event.inputs.run_minutes || '45' }}
  VNC_PORT: ${{ github.event.inputs.vnc_port || '5900' }}
  WEB_PORT: ${{ github.event.inputs.web_port || '6080' }}

jobs:
  desktop:
    name: Windows Server 2025 interactive desktop over VNC + cloudflared
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Preflight - validated runner inventory
        run: |
          $ErrorActionPreference = 'Continue'
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture, TotalVisibleMemorySize, FreePhysicalMemory |
            Format-List
          foreach ($p in @('C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe', 'C:\Program Files\TightVNC\tvnserver.exe', 'C:\ProgramData\chocolatey\bin\choco.exe')) {
            $state = if (Test-Path -LiteralPath $p) { 'EXISTS ' } else { 'MISSING' }
            Write-Host ('{0} {1}' -f $state, $p)
          }

      - name: Resolve Python interpreter and provision VNC server
        run: |
          $ErrorActionPreference = 'Continue'
          $py = @($env:PY_DEFAULT, 'C:\Program Files\Python312\python.exe') |
            Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $py) {
            $dir = 'C:\hostedtoolcache\windows\Python\3.12.10\x64'
            $zip = 'C:\python312.zip'
            Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.zip' -OutFile $zip -UseBasicParsing
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
            Remove-Item -LiteralPath $zip -Force
            $py = Join-Path $dir 'python.exe'
          }
          $env:PY_EXE = $py
          "PY_EXE=$py" >> $env:GITHUB_ENV

          $server = Join-Path $env:TIGHTVNC_ROOT 'tvnserver.exe'
          if (-not (Test-Path -LiteralPath $server)) {
            $choco = 'C:\ProgramData\chocolatey\bin\choco.exe'
            & $choco install tightvnc -y --no-progress --limit-output --ignore-checksums
          }
          if (-not (Test-Path -LiteralPath $server)) { throw 'No VNC server binary available' }
          $env:VNC_SERVER_EXE = $server
          $env:VNC_DIR = Split-Path -Parent $server
          "VNC_SERVER_EXE=$server" >> $env:GITHUB_ENV
          "VNC_DIR=$(Split-Path -Parent $server)" >> $env:GITHUB_ENV

      - name: Install noVNC and websockify
        run: |
          $ErrorActionPreference = 'Stop'
          $py = if ($env:PY_EXE) { $env:PY_EXE } else { $env:PY_DEFAULT }
          New-Item -ItemType Directory -Force -Path $env:NOVNC_DIR | Out-Null
          $zip = 'C:\novnc.zip'
          Invoke-WebRequest 'https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip' -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath 'C:\' -Force
          Remove-Item -LiteralPath $zip -Force
          $src = Get-ChildItem -Path 'C:\' -Directory -Filter 'novnc-*' | Select-Object -First 1
          Copy-Item -Path (Join-Path $src.FullName '*') -Destination $env:NOVNC_DIR -Recurse -Force
          Copy-Item -Path (Join-Path $env:NOVNC_DIR 'vnc.html') -Destination (Join-Path $env:NOVNC_DIR 'index.html') -Force
          Remove-Item -LiteralPath $src.FullName -Recurse -Force
          & $py -m pip install --no-cache-dir --quiet --disable-pip-version-check websockify

      - name: Write VNC configuration
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tight in @('HKLM:\SOFTWARE\TightVNC\Server', 'HKCU:\SOFTWARE\TightVNC\Server')) {
            New-Item -Path $tight -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'RfbPort' -PropertyType DWord -Value ([int]$env:VNC_PORT) -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'AllowLoopback' -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'UseVncAuthentication' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'AcceptRfbConnections' -PropertyType DWord -Value 1 -Force | Out-Null
          }

      - name: Start VNC server on Session desktop
        run: |
          $ErrorActionPreference = 'Continue'
          $port = [int]$env:VNC_PORT
          $server = $env:VNC_SERVER_EXE
          $dir = Split-Path -Parent $server
          Start-Process -FilePath $server -ArgumentList '-run' -WorkingDirectory $dir -WindowStyle Hidden

      - name: Install cloudflared
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $env:CF_STAGED -UseBasicParsing
          New-Item -ItemType Directory -Force -Path (Split-Path $env:CF_EXE) | Out-Null
          Copy-Item -LiteralPath $env:CF_STAGED -Destination $env:CF_EXE -Force

      - name: Write guard loop and tunnel launchers
        run: |
          $ErrorActionPreference = 'Stop'
          $py = if ($env:PY_EXE) { $env:PY_EXE } else { $env:PY_DEFAULT }

          $guard = @(
            '$ErrorActionPreference = "SilentlyContinue"',
            ('$py = "' + $py + '"'),
            '$server = "C:\Program Files\TightVNC\tvnserver.exe"',
            'while ($true) {',
            '  if (-not (Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue)) {',
            '    Start-Process -FilePath $server -ArgumentList "-run" -WindowStyle Hidden -ErrorAction SilentlyContinue',
            '    Start-Sleep -Seconds 5',
            '  }',
            '  if (-not (Get-NetTCPConnection -LocalPort 6080 -State Listen -ErrorAction SilentlyContinue)) {',
            '    Start-Process -FilePath $py -ArgumentList @("-m", "websockify", "0.0.0.0:6080", "127.0.0.1:5900", "--web=C:\novnc") -WindowStyle Hidden -ErrorAction SilentlyContinue',
            '    Start-Sleep -Seconds 5',
            '  }',
            '  Start-Sleep -Seconds 10',
            '}'
          )
          Set-Content -LiteralPath 'C:\vncguard.ps1' -Value $guard -Encoding ASCII

          $webBat = @(
            '@echo off',
            ('"' + $env:CF_EXE + '" tunnel --url http://127.0.0.1:' + $env:WEB_PORT + ' --protocol http2 --edge-ip-version 4 --no-autoupdate > "' + $env:CF_LOG_WEB + '" 2>&1')
          )
          Set-Content -LiteralPath 'C:\tunnel_web.bat' -Value $webBat -Encoding ASCII

      - name: Start guard and tunnels
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Process -FilePath 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -ArgumentList '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File C:\vncguard.ps1' -WindowStyle Hidden
          Start-Process -FilePath 'C:\tunnel_web.bat' -WindowStyle Hidden
          Start-Sleep -Seconds 8

      - name: Resolve public endpoints
        run: |
          $ErrorActionPreference = 'Continue'
          function Get-TunnelUrl {
            param([string]$LogPath, [int]$Attempts = 90)
            for ($i = 0; $i -lt $Attempts; $i++) {
              if (Test-Path -LiteralPath $LogPath) {
                $log = Get-Content -LiteralPath $LogPath -Raw -ErrorAction SilentlyContinue
                if ($log -match 'https://[a-z0-9-]+\.trycloudflare\.com') { return $Matches[0] }
              }
              Start-Sleep -Seconds 2
            }
            return $null
          }
          $webUrl = Get-TunnelUrl -LogPath $env:CF_LOG_WEB
          $webHost = if ($webUrl) { $webUrl -replace '^https?://', '' } else { '' }
          $browser = if ($webHost) { 'https://' + $webHost + '/vnc.html?host=' + $webHost + '&port=443&path=websocket&encrypt=1&autoconnect=1&resize=scale' } else { '' }
          Write-Host "BROWSER_URL=$browser"

      - name: Keep session open
        run: |
          $keep = [int]$env:KEEP_ALIVE
          if ($keep -le 0) { $keep = 340 }
          Start-Sleep -Seconds ($keep * 60)

      - name: Teardown and Secure Wipe
        if: always()
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          # إيقاف العمليات والخدمات المرتبطة
          Get-Process -Name cloudflared, python, tvnserver, winvnc4 | Stop-Process -Force
          Get-Service -Name 'Cloudflared' | Stop-Service -Force

          # مسح شامل وحذف نهائي لأي ملفات مؤقتة، سجلات، أو أدوات تم تنزيلها لضمان النظافة التامة
          $cleanupPaths = @(
              'C:\telemetry',
              'C:\novnc',
              'C:\novnc.zip',
              'C:\python312.zip',
              'C:\winvnc-setup.exe',
              'C:\cloudflared-amd64.exe',
              'C:\vncguard.ps1',
              'C:\tunnel_web.bat',
              'C:\tunnel_vnc.bat',
              'C:\desktop_urls.txt',
              'C:\cf_web.log',
              'C:\cf_web.err.log',
              'C:\websockify.log',
              'C:\vncguard.log'
          )
          foreach ($path in $cleanupPaths) {
              if (Test-Path -LiteralPath $path) {
                  Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "CLEANED: $path"
              }
          }
          Write-Host "Secured and wiped temporary artifacts successfully."
