name: windows-desktop-vnc

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Session lifetime in minutes (0 = until the 5h50m job cap)'
        required: false
        default: '45'
      vnc_port:
        description: 'VNC RFB port (loopback only, consumed by websockify)'
        required: false
        default: '5900'
      web_port:
        description: 'websockify + noVNC HTTP/WebSocket port (tunnel origin)'
        required: false
        default: '6080'

concurrency:
  group: desktop-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: 'C:\'

env:
  NOVNC_DIR: 'C:\novnc'
  CF_STAGED: 'C:\cloudflared-amd64.exe'
  CF_EXE: 'C:\ProgramData\cloudflared\cloudflared.exe'
  CF_LOG_WEB: 'C:\cf_web.log'
  CF_ERR_WEB: 'C:\cf_web.err.log'
  CF_LOG_VNC: 'C:\cf_vnc.log'
  CF_ERR_VNC: 'C:\cf_vnc.err.log'
  WS_LOG: 'C:\websockify.log'
  WS_ERR: 'C:\websockify.err.log'
  GUARD_LOG: 'C:\vncguard.log'
  URL_FILE: 'C:\desktop_urls.txt'
  TIGHTVNC_ROOT: 'C:\Program Files\TightVNC'
  PY_DEFAULT: 'C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe'
  KEEP_ALIVE: ${{ github.event.inputs.run_minutes || '45' }}
  VNC_PORT: ${{ github.event.inputs.vnc_port || '5900' }}
  WEB_PORT: ${{ github.event.inputs.web_port || '6080' }}

jobs:
  desktop:
    name: Windows Server 2025 interactive desktop over VNC + cloudflared
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Preflight - validated runner inventory
        run: |
          $ErrorActionPreference = 'Continue'
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture, TotalVisibleMemorySize, FreePhysicalMemory |
            Format-List
          foreach ($p in @('C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe', 'C:\Program Files\TightVNC\tvnserver.exe', 'C:\ProgramData\chocolatey\bin\choco.exe')) {
            $state = if (Test-Path -LiteralPath $p) { 'EXISTS ' } else { 'MISSING' }
            Write-Host ('{0} {1}' -f $state, $p)
          }
          Get-Process -Name explorer, dwm, winlogon, sihost -ErrorAction SilentlyContinue |
            Select-Object Name, Id, SessionId |
            Format-Table -AutoSize
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in 5900, 6080 } |
            Select-Object LocalAddress, LocalPort, OwningProcess |
            Format-Table -AutoSize
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          Write-Host ('ELEVATED={0} USER={1} SESSION={2}' -f $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator), $env:USERNAME, (Get-Process -Id $PID).SessionId)

      - name: Resolve Python interpreter and provision VNC server
        run: |
          $ErrorActionPreference = 'Continue'
          $py = @($env:PY_DEFAULT, 'C:\Program Files\Python312\python.exe') |
            Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $py) {
            $dir = 'C:\hostedtoolcache\windows\Python\3.12.10\x64'
            $zip = 'C:\python312.zip'
            Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.zip' -OutFile $zip -UseBasicParsing
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
            Remove-Item -LiteralPath $zip -Force
            $py = Join-Path $dir 'python.exe'
          }
          $env:PY_EXE = $py
          "PY_EXE=$py" >> $env:GITHUB_ENV
          & $py -V

          $server = Join-Path $env:TIGHTVNC_ROOT 'tvnserver.exe'
          if (-not (Test-Path -LiteralPath $server)) {
            $choco = 'C:\ProgramData\chocolatey\bin\choco.exe'
            & $choco install tightvnc -y --no-progress --limit-output --ignore-checksums
            Write-Host ('choco exit: ' + $LASTEXITCODE)
          }
          if (-not (Test-Path -LiteralPath $server)) {
            Write-Host 'Requesting WinVNC server installer (best effort).'
            $setup = 'C:\winvnc-setup.exe'
            try {
              Invoke-WebRequest 'https://downloads.sourceforge.net/project/tigervnc/stable/1.14.0/tigervnc64-winvnc-1.14.0.exe' -OutFile $setup -UseBasicParsing -TimeoutSec 60
              if ((Get-Item -LiteralPath $setup).Length -gt 1000000) {
                Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
                if (Test-Path -LiteralPath 'C:\Program Files\TigerVNC\winvnc4.exe') { $server = 'C:\Program Files\TigerVNC\winvnc4.exe' }
              }
            }
            catch { Write-Host 'winvnc fetch failed, staying on the deterministic server' }
            Remove-Item -LiteralPath $setup -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path -LiteralPath $server)) { throw 'No VNC server binary available' }
          $env:VNC_SERVER_EXE = $server
          $env:VNC_DIR = Split-Path -Parent $server
          "VNC_SERVER_EXE=$server" >> $env:GITHUB_ENV
          "VNC_DIR=$(Split-Path -Parent $server)" >> $env:GITHUB_ENV
          Write-Host "VNC_SERVER_EXE=$server"
          Get-ChildItem -LiteralPath (Split-Path -Parent $server) -Filter '*.exe' |
            Select-Object Name, Length, @{n = 'Version'; e = { $_.VersionInfo.FileVersion } } |
            Format-Table -AutoSize

      - name: Install noVNC and websockify with the toolcache interpreter
        run: |
          $ErrorActionPreference = 'Stop'
          $py = if ($env:PY_EXE) { $env:PY_EXE } else { $env:PY_DEFAULT }
          New-Item -ItemType Directory -Force -Path $env:NOVNC_DIR | Out-Null
          $zip = 'C:\novnc.zip'
          Invoke-WebRequest 'https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip' -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath 'C:\' -Force
          Remove-Item -LiteralPath $zip -Force
          $src = Get-ChildItem -Path 'C:\' -Directory -Filter 'novnc-*' | Select-Object -First 1
          Copy-Item -Path (Join-Path $src.FullName '*') -Destination $env:NOVNC_DIR -Recurse -Force
          Copy-Item -Path (Join-Path $env:NOVNC_DIR 'vnc.html') -Destination (Join-Path $env:NOVNC_DIR 'index.html') -Force
          Remove-Item -LiteralPath $src.FullName -Recurse -Force
          & $py -m pip install --no-cache-dir --quiet --disable-pip-version-check websockify
          & $py -m websockify --help 2>&1 | Select-Object -First 3
          Test-Path (Join-Path $env:NOVNC_DIR 'index.html')
          Test-Path (Join-Path $env:NOVNC_DIR 'app/ui.js')

      - name: Write VNC credentials and server configuration
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tight in @('HKLM:\SOFTWARE\TightVNC\Server', 'HKCU:\SOFTWARE\TightVNC\Server')) {
            New-Item -Path $tight -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'RfbPort' -PropertyType DWord -Value ([int]$env:VNC_PORT) -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'AllowLoopback' -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'UseVncAuthentication' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'AcceptRfbConnections' -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'LoopbackOnly' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'UseMirrorDriver' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'GrabTransparentWindows' -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'PollingInterval' -PropertyType DWord -Value 30 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'RfbPortCycle' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $tight -Name 'RunControlInterface' -PropertyType DWord -Value 0 -Force | Out-Null
          }
          foreach ($key in @('HKLM:\SOFTWARE\TigerVNC\WinVNC4', 'HKCU:\SOFTWARE\TigerVNC\WinVNC4')) {
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name 'PortNumber' -PropertyType DWord -Value ([int]$env:VNC_PORT) -Force | Out-Null
            New-ItemProperty -Path $key -Name 'LocalHost' -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name 'Hosts' -PropertyType String -Value '+' -Force | Out-Null
            New-ItemProperty -Path $key -Name 'AuthTypes' -PropertyType String -Value 'None' -Force | Out-Null
            New-ItemProperty -Path $key -Name 'SecurityTypes' -PropertyType String -Value 'None' -Force | Out-Null
            New-ItemProperty -Path $key -Name 'AcceptKeyEvents' -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name 'AcceptPointerEvents' -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name 'DisableLocalInputs' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $key -Name 'RemoveWallpaper' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $key -Name 'DisableEffects' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $key -Name 'UpdateMethod' -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name 'ShowTrayIcon' -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $key -Name 'DisableTrayIcon' -PropertyType DWord -Value 1 -Force | Out-Null
          }
          Get-ItemProperty -Path 'HKLM:\SOFTWARE\TightVNC\Server' | Format-List

      - name: Start VNC server on the live Session 2 desktop
        run: |
          $ErrorActionPreference = 'Continue'
          $port = [int]$env:VNC_PORT
          $server = if ($env:VNC_SERVER_EXE) { $env:VNC_SERVER_EXE } else { Join-Path $env:TIGHTVNC_ROOT 'tvnserver.exe' }
          $dir = Split-Path -Parent $server
          Get-Service -Name 'tvnserver' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          Get-Process -Name tvnserver, winvnc4 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if ($server -match 'tvnserver') {
            Start-Process -FilePath $server -ArgumentList '-run' -WorkingDirectory $dir -WindowStyle Hidden
          }
          else {
            Start-Process -FilePath $server -ArgumentList '-noconsole' -WorkingDirectory $dir -WindowStyle Hidden
          }
          $up = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) { $up = $true; break }
          }
          if (-not $up -and (Test-Path -LiteralPath 'C:\Program Files\TightVNC\tvnserver.exe')) {
            Set-Service -Name 'tvnserver' -StartupType Automatic -ErrorAction SilentlyContinue
            Restart-Service -Name 'tvnserver' -Force -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) { $up = $true; break }
            }
          }
          Write-Host ('VNC_LISTENING=' + $up)
          Get-Process -Name tvnserver, winvnc4 -ErrorAction SilentlyContinue | Select-Object Name, Id, SessionId | Format-Table -AutoSize
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -eq $port } |
            Select-Object LocalAddress, LocalPort, OwningProcess |
            Format-Table -AutoSize

      - name: Hold the console desktop awake and visible
        run: |
          $ErrorActionPreference = 'Continue'
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server' /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization' /v NoLockScreen /t REG_DWORD /d 1 /f
          reg add 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' /v AutoAdminLogon /t REG_SZ /d 1 /f
          reg add 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' /v DefaultUserName /t REG_SZ /d $env:USERNAME /f
          Start-Process -FilePath 'C:\Windows\explorer.exe' -ArgumentList '/n,C:\' -ErrorAction SilentlyContinue
          Start-Process -FilePath 'C:\Windows\System32\cmd.exe' -ArgumentList '/c title desktop-session && mode con:cols=120 lines=30' -ErrorAction SilentlyContinue
          Get-Process -Name explorer, dwm, sihost -ErrorAction SilentlyContinue | Select-Object Name, Id, SessionId | Format-Table -AutoSize

      - name: Install cloudflared
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $env:CF_STAGED -UseBasicParsing
          $warp = Get-ChildItem 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs' -Filter 'Uninstall Cloudflare WARP.lnk' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($warp) {
            Start-Process -FilePath $warp.FullName -ArgumentList '/S' -Wait -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 20
          }
          Get-Service -Name 'Cloudflared' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          & $env:CF_STAGED service install
          Start-Sleep -Seconds 3
          if (-not (Test-Path -LiteralPath $env:CF_EXE)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $env:CF_EXE) | Out-Null
            Copy-Item -LiteralPath $env:CF_STAGED -Destination $env:CF_EXE -Force
          }
          & $env:CF_EXE --version

      - name: Write the guard loop and the tunnel launchers
        run: |
          $ErrorActionPreference = 'Stop'
          $py = if ($env:PY_EXE) { $env:PY_EXE } else { $env:PY_DEFAULT }

          $guard = @(
            '$ErrorActionPreference = "SilentlyContinue"',
            ('$py = "' + $py + '"'),
            '$server = "C:\Program Files\TightVNC\tvnserver.exe"',
            '$log = "C:\vncguard.log"',
            'function Note($m) { Add-Content -Path $log -Value ((Get-Date -Format "HH:mm:ss") + " " + $m) }',
            'Note "guard start"',
            'while ($true) {',
            '  if (-not (Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue)) {',
            '    Start-Process -FilePath $server -ArgumentList "-run" -WindowStyle Hidden -ErrorAction SilentlyContinue',
            '    Note "rfb restarted"',
            '    Start-Sleep -Seconds 5',
            '  }',
            '  if (-not (Get-NetTCPConnection -LocalPort 6080 -State Listen -ErrorAction SilentlyContinue)) {',
            '    Start-Process -FilePath $py -ArgumentList @("-m", "websockify", "0.0.0.0:6080", "127.0.0.1:5900", "--web=C:\novnc") -WindowStyle Hidden -RedirectStandardOutput "C:\websockify.log" -RedirectStandardError "C:\websockify.err.log" -ErrorAction SilentlyContinue',
            '    Note "websockify restarted"',
            '    Start-Sleep -Seconds 5',
            '  }',
            '  Start-Sleep -Seconds 10',
            '}'
          )
          Set-Content -LiteralPath 'C:\vncguard.ps1' -Value $guard -Encoding ASCII

          $webBat = @(
            '@echo off',
            ('"' + $env:CF_EXE + '" tunnel --url http://127.0.0.1:' + $env:WEB_PORT + ' --protocol http2 --edge-ip-version 4 --no-autoupdate --loglevel info > "' + $env:CF_LOG_WEB + '" 2> "' + $env:CF_ERR_WEB + '"')
          )
          Set-Content -LiteralPath 'C:\tunnel_web.bat' -Value $webBat -Encoding ASCII

          $vncBat = @(
            '@echo off',
            ('"' + $env:CF_EXE + '" tunnel --url tcp://127.0.0.1:' + $env:VNC_PORT + ' --protocol http2 --edge-ip-version 4 --no-autoupdate --loglevel info > "' + $env:CF_LOG_VNC + '" 2> "' + $env:CF_ERR_VNC + '"')
          )
          Set-Content -LiteralPath 'C:\tunnel_vnc.bat' -Value $vncBat -Encoding ASCII

      - name: Start guard and tunnels as scheduled tasks
        run: |
          $ErrorActionPreference = 'Continue'
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries `
            -ExecutionTimeLimit (New-TimeSpan -Hours 6) -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) `
            -MultipleInstances IgnoreNew -StartWhenAvailable
          $defs = @(
            @{ Name = 'VncGuard'; Exe = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'; Args = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File C:\vncguard.ps1' },
            @{ Name = 'TunnelWeb'; Exe = 'C:\tunnel_web.bat'; Args = '' },
            @{ Name = 'TunnelVNC'; Exe = 'C:\tunnel_vnc.bat'; Args = '' }
          )
          foreach ($d in $defs) {
            Unregister-ScheduledTask -TaskName $d.Name -Confirm:$false -ErrorAction SilentlyContinue
            $action = if ($d.Args) { New-ScheduledTaskAction -Execute $d.Exe -Argument $d.Args } else { New-ScheduledTaskAction -Execute $d.Exe }
            $registered = $false
            foreach ($logon in @('S4U', 'Interactive')) {
              try {
                $principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType $logon -RunLevel Highest
                Register-ScheduledTask -TaskName $d.Name -Action $action -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
                $registered = $true
                break
              }
              catch { Write-Host ('{0} principal {1} rejected: {2}' -f $d.Name, $logon, $_.Exception.Message) }
            }
            if ($registered) { Start-ScheduledTask -TaskName $d.Name } else { Start-Process -FilePath $d.Exe -ArgumentList $d.Args -WindowStyle Hidden }
          }
          Start-Sleep -Seconds 8
          Get-ScheduledTask -TaskName 'VncGuard', 'TunnelWeb', 'TunnelVNC' -ErrorAction SilentlyContinue |
            Select-Object TaskName, State | Format-Table -AutoSize
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in [int]$env:VNC_PORT, [int]$env:WEB_PORT } |
            Select-Object LocalAddress, LocalPort, OwningProcess | Format-Table -AutoSize
          Get-Process -Name cloudflared, python, tvnserver -ErrorAction SilentlyContinue | Select-Object Name, Id, SessionId | Format-Table -AutoSize

      - name: Resolve public endpoints and validate through the edge
        run: |
          $ErrorActionPreference = 'Continue'
          function Get-TunnelUrl {
            param([string]$LogPath, [int]$Attempts = 90)
            for ($i = 0; $i -lt $Attempts; $i++) {
              if (Test-Path -LiteralPath $LogPath) {
                $log = Get-Content -LiteralPath $LogPath -Raw -ErrorAction SilentlyContinue
                if ($log -match 'https://[a-z0-9-]+\.trycloudflare\.com') { return $Matches[0] }
              }
              Start-Sleep -Seconds 2
            }
            return $null
          }
          $webUrl = Get-TunnelUrl -LogPath $env:CF_LOG_WEB
          $vncUrl = Get-TunnelUrl -LogPath $env:CF_LOG_VNC -Attempts 20
          $webHost = if ($webUrl) { $webUrl -replace '^https?://', '' } else { '' }
          $vncHost = if ($vncUrl) { $vncUrl -replace '^https?://', '' } else { '' }
          
          # طباعة واضحة وبارزة للرابط في السجلات
          if ($webHost) {
            Write-Host "=================================================="
            Write-Host ">>> VNC NO-VNC URL: https://$webHost/vnc.html?host=$webHost&port=443&path=websocket&encrypt=1&autoconnect=1&resize=scale"
            Write-Host "=================================================="
          }

          $status = 0
          if ($webHost) {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $status = (Invoke-WebRequest ('https://' + $webHost + '/vnc.html') -UseBasicParsing -TimeoutSec 20).StatusCode
                if ($status -eq 200) { break }
              }
              catch {
                $status = 0
              }
              Start-Sleep -Seconds 4
            }
          }

          $browser = if ($webHost) { 'https://' + $webHost + '/vnc.html?host=' + $webHost + '&port=443&path=websocket&encrypt=1&autoconnect=1&resize=scale' } else { '' }
          @(
            'WEB_TUNNEL=https://' + $webHost,
            'BROWSER_URL=' + $browser,
            'VNC_TCP_TUNNEL=' + $vncHost,
            'PUBLIC_HTTP=' + $status
          ) | Set-Content -LiteralPath $env:URL_FILE -Encoding ASCII
          $env:WEB_HOST = $webHost
          $env:BROWSER_URL = $browser
          "WEB_HOST=$webHost" >> $env:GITHUB_ENV
          "BROWSER_URL=$browser" >> $env:GITHUB_ENV

      - name: Publish connection parameters
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host ('BROWSER_URL=' + $env:BROWSER_URL)
          Write-Host ('WEB_HOST=' + $env:WEB_HOST)

      - name: Keep the interactive session open for the requested window
        run: |
          $ErrorActionPreference = 'Continue'
          $keep = [int]$env:KEEP_ALIVE
          if ($keep -le 0) { $keep = 340 }
          $deadline = (Get-Date).AddMinutes($keep)
          while ((Get-Date) -lt $deadline) {
            $rfb = Get-NetTCPConnection -LocalPort ([int]$env:VNC_PORT) -State Listen -ErrorAction SilentlyContinue
            $web = Get-NetTCPConnection -LocalPort ([int]$env:WEB_PORT) -State Listen -ErrorAction SilentlyContinue
            $tun = Get-Process -Name cloudflared -ErrorAction SilentlyContinue
            Get-ScheduledTask -TaskName 'VncGuard', 'TunnelWeb' -ErrorAction SilentlyContinue |
              ForEach-Object { if ($_.State -ne 'Running') { Start-ScheduledTask -TaskName $_.TaskName } }
            $log = Get-Content -LiteralPath $env:CF_LOG_WEB -Raw -ErrorAction SilentlyContinue
            $current = if ($log -match 'https://[a-z0-9-]+\.trycloudflare\.com') { $Matches[0] } else { '' }
            if ($current -and $current -ne ('https://' + $env:WEB_HOST)) {
              $env:WEB_HOST = $current -replace '^https?://', ''
              "WEB_HOST=$($env:WEB_HOST)" >> $env:GITHUB_ENV
            }
            Start-Sleep -Seconds 60
          }

      - name: Teardown and Secure Wipe
        if: always()
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          foreach ($t in 'VncGuard', 'TunnelWeb', 'TunnelVNC') {
            Unregister-ScheduledTask -TaskName $t -Confirm:$false -ErrorAction SilentlyContinue
          }
          Get-Process -Name cloudflared, python, tvnserver, winvnc4 | Stop-Process -Force
          Get-Service -Name 'Cloudflared' | Stop-Service -Force
          
          # مسح وتطهير نهائي لأي ملفات مؤقتة أو سجلات لضمان الخصوصية التامة
          $cleanupPaths = @(
              'C:\novnc',
              'C:\novnc.zip',
              'C:\python312.zip',
              'C:\cloudflared-amd64.exe',
              'C:\vncguard.ps1',
              'C:\tunnel_web.bat',
              'C:\tunnel_vnc.bat',
              'C:\desktop_urls.txt',
              'C:\cf_web.log',
              'C:\cf_web.err.log',
              'C:\websockify.log',
              'C:\vncguard.log'
          )
          foreach ($path in $cleanupPaths) {
              if (Test-Path -LiteralPath $path) {
                  Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
              }
          }
